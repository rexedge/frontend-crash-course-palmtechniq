<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        max-width: 1280px;
        margin: 0 auto;
      }
      .row {
        background: #f00;
        display: flex;
        /* flex-direction: row; */
        gap: 10px;
        /* align-items: center; */
        height: 100vh;
        padding: 10px;
        color: #fff;
        /* flex-wrap: wrap; */
      }
      .box {
        background-color: white;
        color: red;
        /* height: 50px;
        width: 50px; */
        display: flex;
        justify-content: center;
        align-items: center;
        border: #0f0 solid 1px;
      }
      .sidebar {
        flex: 0 0 240px;
      }
      .main {
        flex: 1;
      }
      .quick-links {
        flex: 0 0 480px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="box sidebar">1</div>
      <div class="box main">2</div>
      <div class="box quick-links">2</div>
    </div>
  </body>
</html>
